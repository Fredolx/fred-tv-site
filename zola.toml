base_url = "https://tv.fredol.dev"

title = "Fred TV"
description = "Fred TV is a fast, free and open-source IPTV player for Windows, Linux, macOS, Android, iOS and Android TV. Bring your own M3U or Xtream source."
default_language = "en"

compile_sass = true

minify_html = true

[extra]
author = "Frédéric Lachapelle"
bluesky = "https://bsky.app/profile/fredoldev.bsky.social"

repo_desktop = "https://github.com/Fredolx/open-tv"
repo_mobile = "https://github.com/Fredolx/fred-tv-mobile"
issues = "https://github.com/Fredolx/open-tv/issues"

store_microsoft = "https://apps.microsoft.com/detail/9PBWX3RKR1QX?launch=true&mode=mini"
store_apple = "https://apps.apple.com/ca/app/open-tv-open-source-iptv/id6742751800"
store_google = "https://play.google.com/store/apps/details?id=dev.fredol.open_tv"

store_flathub = "https://flathub.org/apps/dev.fredol.open-tv"
store_aur = "https://aur.archlinux.org/packages/open-tv-bin"

donate_github = "https://github.com/sponsors/Fredolx"
donate_paypal = "https://paypal.me/fredolx"

