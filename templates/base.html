<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}: free & open-source IPTV player{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <meta name="theme-color" content="#0a0c16">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ config.title }}: free & open-source IPTV player">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:url" content="{{ config.base_url }}">
  <meta property="og:image" content="{{ get_url(path='img/og-banner.png') }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="{{ get_url(path='favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ get_url(path='apple-touch-icon.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
  <link rel="stylesheet" href="{{ get_url(path='main.css', cachebust=true) }}">
  <script src="{{ get_url(path='js/main.js', cachebust=true) }}" defer></script>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
